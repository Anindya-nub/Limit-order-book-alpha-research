[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lob-alpha-research"
version = "0.1.0"
description = "Event-time LOB research, leak-aware forecasting and executable-price backtesting"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4.0"]
dev = ["pytest>=7.4"]

[project.scripts]
lob-alpha = "lob_alpha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
